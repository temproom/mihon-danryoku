name: Build Danryoku APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/all/danryoku/**'
      - '.github/workflows/build-danryoku.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@d156388eb19639ec20ade50009f3d199ce1e2808 # v4
        with:
          cache-read-only: true

      - name: Generate temporary signing key
        run: |
          keytool -genkeypair -v \
            -keystore signingkey.jks \
            -alias danryoku \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass danryoku123 -keypass danryoku123 \
            -dname "CN=Danryoku, OU=Extension, O=Personal, L=City, ST=State, C=US"

      - name: Fix code formatting
        run: ./gradlew :src:all:danryoku:spotlessApply

      - name: Build Danryoku Release APK
        env:
          ALIAS: danryoku
          KEY_STORE_PASSWORD: danryoku123
          KEY_PASSWORD: danryoku123
        run: ./gradlew :src:all:danryoku:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: danryoku-release-apk
          path: src/all/danryoku/build/outputs/apk/release/*.apk
          retention-days: 7
