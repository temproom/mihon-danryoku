name: Build Danryoku APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/all/danryoku/**'
      - '.github/workflows/build-danryoku.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Generate temporary signing key
        run: |
          keytool -genkeypair -v \
            -keystore signingkey.jks \
            -alias danryoku \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass danryoku123 -keypass danryoku123 \
            -dname "CN=Danryoku, OU=Extension, O=Personal, L=City, ST=State, C=US"

      - name: Build Danryoku Release APK
        env:
          ALIAS: danryoku
          KEY_STORE_PASSWORD: danryoku123
          KEY_PASSWORD: danryoku123
        run: ./gradlew :src:all:danryoku:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: danryoku-release-apk
          path: src/all/danryoku/build/outputs/apk/release/*.apk
          retention-days: 7